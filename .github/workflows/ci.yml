name: AETHER CI
on:
  push:
    branches: [aether-dev]
  pull_request:
    branches: [aether-dev]
  workflow_dispatch:
jobs:
  host-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host build
        run: cmake -S . -B build -DAETHER_BUILD_TESTS=ON -DAETHER_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit and runtime tests
        run: ctest --test-dir build --output-on-failure
      - name: Version smoke test
        run: test "$(./build/native/aether-supervisor --version)" = "0.9.2-webroot"
      - name: Live procfs and snapshot smoke test
        run: |
          set -euo pipefail
          ./build/native/aether-supervisor --once > /tmp/aether-sample.jsonl
          python3 - <<'PY'
          import json
          with open("/tmp/aether-sample.jsonl", encoding="utf-8") as stream:
              rows = [json.loads(line) for line in stream]
          assert len(rows) == 4
          assert rows[0]["authority"] == "LMKD_FALLBACK"
          assert "total_kib" in rows[1]
          assert "processes" in rows[2]
          assert "events" in rows[3]
          PY
          ./build/native/aether-supervisor --state-dir /tmp/aether-state --interval-ms 100 &
          AETHER_PID=$!
          trap 'kill "$AETHER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            test -s /tmp/aether-state/status.json && break
            sleep 0.2
          done
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("/tmp/aether-state")
          expected = {"status.json", "memory.json", "processes.json", "events.json"}
          assert expected.issubset({p.name for p in root.iterdir()})
          for name in expected:
              json.loads((root / name).read_text())
          assert json.loads((root / "status.json").read_text())["authority"] == "LMKD_FALLBACK"
          PY
      - name: WebUI architecture regression checks
        run: |
          set -euo pipefail
          test -f module/webroot/index.html
          ! test -e module/web/index.html
          ! test -e native/src/http_server.cpp
          ! test -e native/include/aether/http_server.hpp
          ! grep -R -nE '127\.0\.0\.1|localhost|fetch\(|--port|HttpServer' module native CMakeLists.txt
          grep -q 'window.ksu' module/webroot/index.html
          grep -q 'ksu.exec' module/webroot/index.html
          grep -q 'webroot/index.html' scripts/package-module.sh
          grep -q 'action.sh' module/customize.sh
  android-arm64-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
      - name: Install NDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"
      - name: Build and package ARM64 module
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/package-module.sh
      - name: Upload ARM64 module artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Serenity-0.9.2-arm64
          path: dist/AETHER-Serenity-0.9.2-arm64.zip
          if-no-files-found: error
