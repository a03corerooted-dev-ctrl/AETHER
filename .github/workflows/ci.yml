name: AETHER CI
on:
  push:
    branches: [aether-dev]
  pull_request:
    branches: [aether-dev]
  workflow_dispatch:
jobs:
  host-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host build
        run: cmake -S . -B build -DAETHER_BUILD_TESTS=ON -DAETHER_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit and runtime tests
        run: ctest --test-dir build --output-on-failure
      - name: Version smoke test
        run: ./build/native/aether-supervisor --version
      - name: Live procfs smoke test
        run: |
          ./build/native/aether-supervisor --once > /tmp/aether-sample.jsonl
          python3 - <<'PY'
          import json
          with open("/tmp/aether-sample.jsonl", encoding="utf-8") as stream:
              status = json.loads(stream.readline())
              memory = json.loads(stream.readline())
          assert status["authority"] == "LMKD_FALLBACK"
          assert "total_kib" in memory
          print("Live procfs sample:", status["pressure_level"], memory["total_kib"], "KiB")
          PY
      - name: HTTP and WebUI smoke test
        run: |
          set -euo pipefail
          ./build/native/aether-supervisor --web-root "$PWD/module/web" --port 18765 > /tmp/aether-supervisor.log 2>&1 &
          AETHER_PID=$!
          trap 'kill "$AETHER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18765/api/v1/status > /tmp/aether-status.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; s=json.load(open("/tmp/aether-status.json")); assert s["authority"] == "LMKD_FALLBACK"'
          curl -fsS http://127.0.0.1:18765/api/v1/memory | python3 -c 'import json,sys; assert "total_kib" in json.load(sys.stdin)'
          curl -fsS http://127.0.0.1:18765/api/v1/processes | python3 -c 'import json,sys; assert "processes" in json.load(sys.stdin)'
          curl -fsS http://127.0.0.1:18765/ | grep -q "AETHER"
  android-arm64-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
      - name: Install NDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"
      - name: Build and package ARM64 module
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/package-module.sh
      - name: Upload ARM64 module artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Serenity-0.9.0-arm64
          path: dist/AETHER-Serenity-0.9.0-arm64.zip
          if-no-files-found: error
