name: AETHER CI
on:
  push:
    branches: [aether-dev]
  pull_request:
    branches: [aether-dev]
  workflow_dispatch:
jobs:
  host-build-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host build
        run: cmake -S . -B build -DAETHER_BUILD_TESTS=ON -DAETHER_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: ./build/native/aether-supervisor --version
  android-arm64-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android SDK manager
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
      - name: Install NDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" "ndk;27.2.12479018"
      - name: Configure ARM64 build
        run: cmake -S . -B build-android -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DAETHER_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build ARM64 supervisor
        run: cmake --build build-android --parallel
